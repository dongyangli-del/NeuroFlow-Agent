name: eeg-benchmark-hunter
version: 0.2.1
status: stable
verification_status: source-traced
purpose: Find and audit neural, behavioral, and BCI benchmarks for access, license, splits, metrics, baselines, and leakage.
natural_triggers:
  - "find EEG dataset"
  - "is this benchmark fair"
  - "leakage risk"
  - "baseline protocol"
  - "leaderboard"
  - "找 EEG 数据集"
  - "这个 benchmark 靠谱吗"
  - "有没有 leakage"
anchors:
  verbs:
    - find
    - audit
    - verify
    - compare
  objects:
    - EEG benchmark
    - dataset split
    - metric protocol
    - leakage risk
  constraints:
    - access and license first
    - subject/session split validity
    - benchmark facts before experiments
outputs:
  primary: benchmark card with access, split, metric, baseline, and leakage status
always_load:
  - ../_shared/core/proportional-execution.md
  - references/benchmark-card-template.md
  - references/benchmark-risk-checklist.md
  - ../_shared/core/bci-validity.md
  - ../_shared/core/source-traceability.md
  - ../_shared/core/output-contracts.md
axes:
  audit:
    access: Verify download, license, human-subject, and use restrictions.
    split: Verify subject, session, stimulus, repetition, and temporal split risks.
    metric: Verify metric supports the stated claim.
    baseline: Verify comparable preprocessing, split, model, and evaluator.
on_demand:
  - condition: claim or paper positioning
    load: ../_shared/core/claim-discipline.md
  - condition: conference-facing benchmark recommendation
    load: ../_shared/core/reviewer-risk.md
routing_boundary:
  do_not_use_when:
    - The benchmark, split, and access facts are already fixed and the user needs ablations or statistics.
    - The task is repository execution, checkpoint validation, or expected-output reproduction.
    - The task is only paper prose after benchmark facts are already audited.
  prefer_over:
    - skill: experiment-copilot
      when: Dataset access, license, split, metric, or baseline protocol is unresolved.
    - skill: paper-rag-plus
      when: The user asks whether a benchmark can support a claim rather than what a paper says.
  defer_to:
    - skill: paper-rag-plus
      when: The benchmark facts depend on unverified paper claims or citations.
    - skill: experiment-copilot
      when: The benchmark is chosen and the next task is an experiment matrix.
    - skill: repro-pack
      when: The selected benchmark must be made runnable.
  competes_with:
    - experiment-copilot
    - paper-rag-plus
    - repro-pack
