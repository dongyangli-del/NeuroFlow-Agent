name: repro-pack
version: 0.2.1
status: stable
verification_status: source-traced
purpose: Build minimal runnable reproduction contracts with source-traced environment, data, weights, commands, outputs, and blockers.
natural_triggers:
  - "make this reproducible"
  - "smoke test"
  - "reproduce this repo"
  - "baseline table"
  - "observability level"
  - "what is verified"
  - "independent review"
  - "复现"
  - "跑通 repo"
  - "复现证据等级"
  - "独立审查"
anchors:
  verbs:
    - reproduce
    - smoke-test
    - inventory
    - verify
  objects:
    - runnable command
    - environment contract
    - data and weights
    - expected output
  constraints:
    - minimal runnable path first
    - observability level explicit
    - no claim of reproduction without run evidence
outputs:
  primary: reproduction contract with environment, data, command, expected output, and observability level
always_load:
  - ../_shared/core/proportional-execution.md
  - references/repro-contract.md
  - references/observability-levels.md
  - ../_shared/core/source-traceability.md
  - ../_shared/core/research-integrity.md
  - ../_shared/core/cross-model-review.md
  - ../_shared/core/output-contracts.md
axes:
  target:
    smoke: Minimal command and expected output.
    figure: Paper figure or qualitative output reproduction.
    table: Baseline or metric table reproduction.
    checkpoint: Weight, config, and inference path validation.
    observability: L0/L1/L2/L3 evidence level and upgrade path for the target artifact.
    cross_model_review: Independent review before L2/L3 or paper-facing reproduction approval.
on_demand:
  - condition: setup, data, weights, or command failure
    load: references/failure-recovery.md
  - condition: dataset access or split protocol
    load: ../_shared/core/bci-validity.md
routing_boundary:
  do_not_use_when:
    - The task only asks for a paper summary, citation support, or writing polish.
    - The user needs a new experiment matrix after a runnable path already exists.
    - The request is benchmark discovery before a target repository, command, or artifact is selected.
  prefer_over:
    - skill: experiment-copilot
      when: No minimal runnable command, environment, data path, weights, or expected output exists yet.
    - skill: reviewer-simulator
      when: The main uncertainty is reproduction observability rather than paper risk.
  defer_to:
    - skill: paper-rag-plus
      when: The paper facts, target table, or claimed metric have not been source-traced.
    - skill: eeg-benchmark-hunter
      when: Dataset access, license, or split protocol is unresolved.
    - skill: experiment-copilot
      when: A smoke path works and the next step is baseline or ablation design.
  competes_with:
    - experiment-copilot
    - eeg-benchmark-hunter
    - reviewer-simulator
