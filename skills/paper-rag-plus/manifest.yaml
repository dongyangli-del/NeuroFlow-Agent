name: paper-rag-plus
version: 0.2.1
status: stable
verification_status: source-traced
purpose: Ground claims, citations, dataset facts, method facts, and related work in inspected literature and traceable sources.
natural_triggers:
  - "support this claim"
  - "closest prior work"
  - "citation map"
  - "claim ledger"
  - "citation mismatch"
  - "verify this citation"
  - "knowledge graph"
  - "kb search"
  - "cross-model review"
  - "literature grounding"
  - "相关工作"
  - "引用依据"
  - "claim 证据表"
  - "核验引用"
  - "知识图谱"
  - "交叉模型审查"
anchors:
  verbs:
    - ground
    - verify
    - map
    - cite
  objects:
    - claim ledger
    - citation support
    - paper fact
    - related work
  constraints:
    - inspected sources only
    - evidence tier explicit
    - no invented citations
outputs:
  primary: source-traced claim ledger or paper fact card
always_load:
  - ../_shared/core/proportional-execution.md
  - references/claim-grounding.md
  - references/claim-ledger.md
  - references/rag-eval-constraints.md
  - ../_shared/core/source-traceability.md
  - ../_shared/core/claim-discipline.md
  - ../_shared/core/research-integrity.md
  - ../_shared/core/cross-model-review.md
axes:
  task:
    claim: Map a claim to inspected citations and weak links.
    paper: Extract reusable method, dataset, metric, and limitation facts.
    novelty: Separate closest prior work from method or application novelty.
    dataset: Verify dataset facts before benchmark or reproduction use.
    ledger: Build claim-level evidence rows with source span, evidence tier, support status, weakest link, and safer wording.
    cross_model_review: Independent review for citation-critical claim ledgers.
on_demand:
  - condition: public knowledge graph, paper index summary, or large-map entry point
    load: references/papers-index-summary.md
  - condition: benchmark, dataset, or split facts
    load: ../_shared/core/bci-validity.md
  - condition: paper-facing claim or rebuttal
    load: ../_shared/core/reviewer-risk.md
routing_boundary:
  do_not_use_when:
    - The user mainly wants polished prose, captions, or abstract writing after evidence is already inspected.
    - The user needs runnable commands, environment checks, or reproduction observability.
    - The user needs a full reviewer simulation rather than citation or source grounding.
  prefer_over:
    - skill: oral-writer
      when: Citations, novelty, dataset facts, or claim support have not been inspected.
    - skill: reviewer-simulator
      when: The blocker is source fit or citation support rather than review strategy.
  defer_to:
    - skill: oral-writer
      when: Evidence is already inspected and the task is wording, structure, caption, or table prose.
    - skill: repro-pack
      when: The question is whether a repository, command, checkpoint, or table can run.
  competes_with:
    - oral-writer
    - reviewer-simulator
    - eeg-benchmark-hunter
