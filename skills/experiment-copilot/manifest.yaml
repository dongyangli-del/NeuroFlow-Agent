name: experiment-copilot
version: 0.2.0
status: stable
purpose: Convert claims into executable experiment matrices, ablations, controls, statistics, and stop rules.
natural_triggers:
  - "design ablations"
  - "baseline is stronger"
  - "what experiment should I run"
  - "metric gap"
  - "statistical test"
  - "设计消融"
  - "baseline 比不过"
  - "实验矩阵"
always_load:
  - references/experiment-matrix.md
  - ../_shared/core/evidence-gates.md
  - ../_shared/core/output-contracts.md
axes:
  task:
    debugging: Metric gap or failed run diagnosis.
    ablation: Mechanism or component validation.
    paper-claim: Evidence needed before writing a claim.
  modality:
    eeg: Use BCI validity checks for split, time window, normalization, and leakage.
    fmri: Check subject/session split, ROI or voxel target, and preprocessing version.
    behavior: Check task design, confounds, statistical uncertainty, and causal wording.
on_demand:
  - condition: leakage, split, baseline, or neural signal validity risk
    load: ../_shared/core/bci-validity.md
  - condition: paper-facing interpretation or reviewer risk
    load: ../_shared/core/reviewer-risk.md
