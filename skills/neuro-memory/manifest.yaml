name: neuro-memory
version: 0.2.1
status: stable
verification_status: user-validated
purpose: Compress meaningful sessions into reusable workflow, playbook, finding, case, eval, or private memory with explicit verification state.
natural_triggers:
  - "make this reusable"
  - "save this lesson"
  - "turn this into memory"
  - "case to eval"
  - "沉淀经验"
  - "写入记忆"
anchors:
  verbs:
    - compress
    - persist
    - route
    - validate
  objects:
    - reusable lesson
    - workflow memory
    - eval case
    - private note
  constraints:
    - work must be complete
    - privacy filter required
    - verification state explicit
outputs:
  primary: memory candidate with target, privacy status, verification status, and reuse rule
always_load:
  - ../_shared/core/proportional-execution.md
  - references/memory-routing.md
  - references/privacy-policy.md
  - ../_shared/core/source-traceability.md
  - ../_shared/core/output-contracts.md
axes:
  memory_type:
    workflow: Reusable task sequence or first-read rule.
    playbook: Repeated failure mode or recovery sequence.
    finding: Dated inspected result that changes future decisions.
    case: Public example showing workflow value.
    eval: Behavior future agents must preserve.
    private: Sensitive or unpublished context outside public files.
on_demand:
  - condition: producing memory candidate
    load: references/compression-template.md
  - condition: literature or Zotero memory
    load: references/zotero-memory-policy.md
routing_boundary:
  do_not_use_when:
    - The session has not produced a reusable behavior change, finding, case, eval, or private note.
    - The user needs active research execution, paper grounding, experiment design, reproduction, or writing.
    - The content contains private or unpublished material that cannot be safely summarized.
  prefer_over:
    - skill: any specialist
      when: The work is complete and the remaining decision is what should persist.
  defer_to:
    - skill: neuro-orchestrator
      when: The task still needs routing or execution before memory consolidation.
    - skill: ai-bci-research
      when: The memory is domain guardrail context rather than session behavior.
  competes_with:
    - neuro-orchestrator
    - ai-bci-research
