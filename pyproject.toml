[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflow-agent-runtime"
version = "0.3.0"
description = "Evidence-gated, semi-automatic evolution runtime for NeuroFlow-Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
neuroflow = "neuroflow_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["neuroflow_runtime*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/neuroflow_runtime/reporting.py" = ["E501"]
